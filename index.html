<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taste — a design inspiration library</title>
<meta name="description" content="A curated, labelled library of design inspiration: what each design is, its vocabulary, a brief, a build prompt and an image recipe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* Set the saved theme before first paint so there's no flash of the wrong one. */
  try {
    var t = localStorage.getItem("taste-theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
